{% extends "page_view.html" %}
{% load i18n %}
{% block page.content %}
  {% if documents %}
    <ul class="menu bg-base-200 rounded-box w-full max-w-md">
      {% for document in documents %}
        <li><a href="{% url 'mvp_compliance:document' document.slug %}">{{ document.name }}</a></li>
      {% endfor %}
    </ul>
  {% else %}
    <p>{% translate "Nothing has been published yet." %}</p>
  {% endif %}
{% endblock page.content %}
