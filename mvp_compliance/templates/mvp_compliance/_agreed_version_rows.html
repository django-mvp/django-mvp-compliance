{% load i18n %}
{% for acceptance in acceptances %}
<tr>
  <th scope="row" class="font-normal">
    <span class="flex flex-wrap items-center gap-2">
      <a class="link" href="{% url 'mvp_compliance:document' document.slug %}?version={{ acceptance.version.number }}">{% blocktranslate with number=acceptance.version.number %}v{{ number }}{% endblocktranslate %}<span class="sr-only">, {{ document.name }}</span></a>
      {% if acceptance.version.status == "current" %}
        <c-badge size="sm" variant="success" class="badge-soft" text="{% translate "In force" %}" />
      {% else %}
        <c-badge size="sm" variant="ghost" text="{% translate "Replaced" %}" />
      {% endif %}
    </span>
  </th>
  <td class="whitespace-nowrap tabular-nums">
    <time datetime="{{ acceptance.accepted_at|date:"c" }}">{{ acceptance.accepted_at|date }}</time>
  </td>
</tr>
{% endfor %}
